name: Build and Release Tauri App
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm install
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate signing key (if not set)
        shell: pwsh
        run: |
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -eq "") {
            npm exec -- tauri signer generate --ci --force
            if (Test-Path "src-tauri/pubkey.pem") {
              $pub = Get-Content "src-tauri/pubkey.pem" -Raw
              $priv = Get-Content "keys/nagalli-ambiental.key" -Raw
              Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$priv"
              Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PUB_KEY=$pub"
            } elseif (Test-Path "pubkey.pem") {
              $pub = Get-Content "pubkey.pem" -Raw
              $priv = Get-Content "privatekey.pem" -Raw
              Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$priv"
              Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PUB_KEY=$pub"
            }
          }

      - name: Update tauri.conf.json with pubkey
        shell: pwsh
        run: |
          $pub = if ("${{ secrets.TAURI_SIGNING_PUB_KEY }}" -ne "") { "${{ secrets.TAURI_SIGNING_PUB_KEY }}" } else { $env:TAURI_SIGNING_PUB_KEY }
          if ($pub) {
            (Get-Content "src-tauri/tauri.conf.json") -replace '"pubkey": ".*"', "`"pubkey`": `"$pub`"" | Set-Content "src-tauri/tauri.conf.json"
          }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        id: tauri_build
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nagalli Ambiental v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || env.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
